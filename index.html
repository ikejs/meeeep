<body>

  <header>
    <h1><span class="meeeep">Meeeep</span> — The Online Taboo Buzzer</h1>
    <p class="tagline">Lost the buzzer? Tap &amp; hold the big red button. You know the sound.</p>
  </header>

  <div class="stage">
    <div class="halo"></div>
    <div class="device">
      <div class="well">
        <div class="ring" id="ring"></div>
        <button id="buzzer" aria-label="Hold to buzz"></button>
      </div>
    </div>
  </div>

  <footer>
    <a class="coffee" href="https://venmo.com/u/ike-h" target="_blank" rel="noopener">☕ Buy me a coffee</a>
    <p class="fineprint">Free fan-made buzzer for game night. Not affiliated with or endorsed by Hasbro. Taboo is a trademark of Hasbro, Inc.</p>
  </footer>

<script>
(() => {
  const btn  = document.getElementById('buzzer');
  const ring = document.getElementById('ring');

  /* ---------------- audio: a weak, deflated "meeeep" ---------------- */
  let ctx, master;

  function initAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 6;
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(comp).connect(ctx.destination);
  }

  // Real recording if buzz.mp3 is present; synthesized buzz if it isn't.
  let sample = null;
  window.__buzzSource = 'synth';

  fetch('buzz.mp3')
    .then(r => (r.ok ? r.arrayBuffer() : Promise.reject(new Error(r.status))))
    .then(buf => { initAudio(); return ctx.decodeAudioData(buf); })
    .then(decoded => { sample = decoded; window.__buzzSource = 'file'; })
    .catch(() => { window.__buzzSource = 'synth'; });

  let voice = null;

  function startBuzz() {
    initAudio();
    if (ctx.state === 'suspended') ctx.resume();
    if (voice) return;

    const t = ctx.currentTime;

    if (sample) {
      // Loop the recording for as long as the button is held. The loop window sits
      // inside the steady middle, clear of the mp3 decoder's edge padding, so it
      // repeats without a tick.
      const src = ctx.createBufferSource();
      src.buffer = sample;
      src.loop = true;
      src.loopStart = Math.min(0.5, sample.duration * 0.15);
      src.loopEnd = Math.max(src.loopStart + 0.2, sample.duration - 0.12);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.8, t + 0.012); // avoids a click on attack
      src.connect(g).connect(master);
      src.start(t);
      voice = { nodes: [src], g };
      return;
    }

    // Two slightly detuned reedy oscillators => that cheap-plastic beating buzz.
    const oscA = ctx.createOscillator();
    const oscB = ctx.createOscillator();
    oscA.type = 'sawtooth';
    oscB.type = 'square';
    oscA.frequency.setValueAtTime(232, t);
    oscB.frequency.setValueAtTime(233.6, t);

    // Sags a few Hz over the first moment — sounds tired, like a dying 9V.
    oscA.frequency.linearRampToValueAtTime(224, t + 1.6);
    oscB.frequency.linearRampToValueAtTime(225.4, t + 1.6);

    // Wobble, so it never sounds like a clean synth tone.
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.frequency.value = 6.2;
    lfoGain.gain.value = 3.4;
    lfo.connect(lfoGain);
    lfoGain.connect(oscA.frequency);
    lfoGain.connect(oscB.frequency);

    // Lowpass hard: kills the bite, leaves a muffled honk.
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1500, t);
    lp.frequency.exponentialRampToValueAtTime(760, t + 0.9);
    lp.Q.value = 4;

    // Thin out the bottom so it's puny, not beefy.
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 170;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.018);  // soft attack, no snap
    g.gain.linearRampToValueAtTime(0.115, t + 0.35);  // and it immediately gives up

    oscA.connect(lp); oscB.connect(lp);
    lp.connect(hp).connect(g).connect(master);

    oscA.start(t); oscB.start(t); lfo.start(t);
    voice = { nodes: [oscA, oscB, lfo], g };
  }

  function stopBuzz() {
    if (!voice) return;
    const { nodes, g } = voice;
    voice = null;
    const t = ctx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.09); // little deflating tail
    nodes.forEach(o => o.stop(t + 0.12));
  }

  /* ---------------- interaction ---------------- */
  let held = false;

  function down(e) {
    if (held) return;
    if (e.cancelable) e.preventDefault();
    held = true;

    btn.classList.add('down');
    document.body.classList.add('buzzing');

    ring.classList.remove('go');
    void ring.offsetWidth;
    ring.classList.add('go');

    startBuzz();
    if (navigator.vibrate) navigator.vibrate(18);
  }

  function up() {
    if (!held) return;
    held = false;
    btn.classList.remove('down');
    document.body.classList.remove('buzzing');
    stopBuzz();
  }

  // Pointer events cover mouse + touch + pen in one path.
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());

  // Keyboard: space / enter hold to buzz.
  window.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); down(e); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'Enter') up();
  });

  // Never leave it droning if the tab/app goes away.
  window.addEventListener('blur', up);
  document.addEventListener('visibilitychange', () => { if (document.hidden) up(); });

  // Stop iOS double-tap zoom from eating fast repeated buzzes.
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
